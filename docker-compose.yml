services:
  # 1. Layanan Database: MySQL 8.0
  db:
    image: mysql:8.0
    container_name: helpdesk-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_glotra_pass_2026}
      MYSQL_DATABASE: ${DB_NAME:-helpdesk_glotra}
      MYSQL_USER: ${DB_USER:-glotra_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-glotra_password_2026}
    volumes:
      - ${MYSQL_STORAGE_PATH:-mysql_data}:/var/lib/mysql
    ports:
      # Port 3306 hanya dibuka di 127.0.0.1 (localhost VPS) agar aman dari luar
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_glotra_pass_2026}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - helpdesk-net

  # 2. Layanan Backend API: Express.js + Prisma ORM
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: helpdesk-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: mysql://${DB_USER:-glotra_user}:${DB_PASSWORD:-glotra_password_2026}@db:3306/${DB_NAME:-helpdesk_glotra}
      JWT_SECRET: ${JWT_SECRET:-glotra_jwt_secret_production_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      SEED_ON_START: ${SEED_ON_START:-auto}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-15}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      EMAIL_PLATFORM: ${EMAIL_PLATFORM:-resend}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Glotra ServiceDesk (No-Reply)}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-onboarding@resend.dev}
      SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-resend}
      SMTP_PASS: ${SMTP_PASS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    volumes:
      # Volume persisten untuk file lampiran bukti digital & dokumen KB
      - ${UPLOAD_STORAGE_PATH:-uploads_data}:/app/uploads
      # Mount .env host ke container agar perubahan dari menu Gateway Email tersimpan permanen
      # (Pastikan sudah menjalankan 'cp .env.example .env' sebelum 'docker compose up')
      - ./.env:/app/.env
    networks:
      - helpdesk-net

  # 3. Layanan Frontend: Vue.js 3 + Nginx Web Server & Reverse Proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: helpdesk-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Port web publik (default 80; bisa diisi FRONTEND_PORT=127.0.0.1:8080 di .env jika memakai Caddy/Nginx host)
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - helpdesk-net

volumes:
  mysql_data:
    name: helpdesk_mysql_data
  uploads_data:
    name: helpdesk_uploads_data

networks:
  helpdesk-net:
    name: helpdesk-net
    driver: bridge
